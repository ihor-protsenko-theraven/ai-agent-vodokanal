name: Release Please

on:
  push:
    branches:
      - main

# The action creates/updates a release PR and, after that PR is merged,
# creates the corresponding GitHub Release and vX.Y.Z tag.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
